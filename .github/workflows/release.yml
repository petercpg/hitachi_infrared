name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'


permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate version bump
        id: calculate_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            NEW_VER="${TAG_NAME#v}"
            echo "Triggered by tag push: $TAG_NAME"
          else
            MANIFEST_VER=$(jq -r '.version' custom_components/hitachi_infrared/manifest.json)
            if [ -z "$MANIFEST_VER" ] || [ "$MANIFEST_VER" = "null" ]; then
              MANIFEST_VER="1.0.0"
            fi

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST_VER="${LATEST_TAG#v}"

            echo "Manifest version: $MANIFEST_VER"
            echo "Latest Git Tag: $LATEST_TAG ($LATEST_VER)"

            # Strip non-numeric suffixes (e.g. -beta.1) for numeric comparison and arithmetic
            MANIFEST_NUMERIC=$(echo "$MANIFEST_VER" | sed -E 's/[-+].*$//')
            LATEST_NUMERIC=$(echo "$LATEST_VER" | sed -E 's/[-+].*$//')

            IFS='.' read -r MANIFEST_MAJOR MANIFEST_MINOR MANIFEST_PATCH <<< "$MANIFEST_NUMERIC"
            IFS='.' read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_NUMERIC"

            MANIFEST_MAJOR=${MANIFEST_MAJOR:-0}
            MANIFEST_MINOR=${MANIFEST_MINOR:-0}
            MANIFEST_PATCH=${MANIFEST_PATCH:-0}
            LATEST_MAJOR=${LATEST_MAJOR:-0}
            LATEST_MINOR=${LATEST_MINOR:-0}
            LATEST_PATCH=${LATEST_PATCH:-0}

            if [ "$MANIFEST_MAJOR" -gt "$LATEST_MAJOR" ] 2>/dev/null || \
               { [ "$MANIFEST_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$MANIFEST_MINOR" -gt "$LATEST_MINOR" ]; } 2>/dev/null || \
               { [ "$MANIFEST_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$MANIFEST_MINOR" -eq "$LATEST_MINOR" ] && [ "$MANIFEST_PATCH" -gt "$LATEST_PATCH" ]; } 2>/dev/null || \
               [[ "$MANIFEST_VER" == *"-beta"* ]] || [[ "$MANIFEST_VER" == *"-rc"* ]]; then
                NEW_VER="$MANIFEST_VER"
                echo "Using version from manifest.json: $NEW_VER"
            else
                NEXT_PATCH=$((LATEST_PATCH + 1))
                NEW_VER="${LATEST_MAJOR}.${LATEST_MINOR}.${NEXT_PATCH}"
                echo "Auto incremented patch version to: $NEW_VER"
            fi
            TAG_NAME="v$NEW_VER"
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "v" ] || [ -z "$NEW_VER" ]; then
            echo "::error::Calculated version is invalid or empty!"
            exit 1
          fi

          # Update manifest.json with calculated version
          jq --arg v "$NEW_VER" '.version = $v' custom_components/hitachi_infrared/manifest.json > tmp.json && mv tmp.json custom_components/hitachi_infrared/manifest.json

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$NEW_VER" >> $GITHUB_ENV

      - name: Commit manifest.json version bump
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/hitachi_infrared/manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): bump version to ${{ env.TAG_NAME }} [skip ci]" && git push origin release)




      - name: Zip custom component
        run: |
          cd custom_components
          zip -r ../hitachi_infrared.zip hitachi_infrared
          cd ..

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: hitachi_infrared.zip

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: hitachi_infrared.zip
          sbom-path: sbom.spdx.json

      - name: Create Release and Upload Assets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ env.TAG_NAME }}" ]; then
            echo "Error: TAG_NAME is empty."
            exit 1
          fi
          PRERELEASE_FLAG=""
          if [[ "${{ env.TAG_NAME }}" == *"-beta"* ]] || [[ "${{ env.TAG_NAME }}" == *"-rc"* ]] || [[ "${{ env.TAG_NAME }}" == *"-alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ env.TAG_NAME }}" hitachi_infrared.zip sbom.spdx.json \
            --title "${{ env.TAG_NAME }}" \
            $PRERELEASE_FLAG \
            --generate-notes


