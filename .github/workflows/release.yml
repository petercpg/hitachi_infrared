name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version bump
        id: calculate_version
        run: |
          MANIFEST_VER=$(jq -r '.version' custom_components/hitachi_infrared/manifest.json)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VER="${LATEST_TAG#v}"

          echo "Manifest version: $MANIFEST_VER"
          echo "Latest Git Tag: $LATEST_TAG ($LATEST_VER)"

          IFS='.' read -r MANIFEST_MAJOR MANIFEST_MINOR MANIFEST_PATCH <<< "$MANIFEST_VER"
          IFS='.' read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_VER"

          MANIFEST_MAJOR=${MANIFEST_MAJOR:-0}
          MANIFEST_MINOR=${MANIFEST_MINOR:-0}
          MANIFEST_PATCH=${MANIFEST_PATCH:-0}
          LATEST_MAJOR=${LATEST_MAJOR:-0}
          LATEST_MINOR=${LATEST_MINOR:-0}
          LATEST_PATCH=${LATEST_PATCH:-0}

          if [ "$MANIFEST_MAJOR" -gt "$LATEST_MAJOR" ] 2>/dev/null || \
             { [ "$MANIFEST_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$MANIFEST_MINOR" -gt "$LATEST_MINOR" ]; } 2>/dev/null; then
              NEW_VER="$MANIFEST_VER"
              echo "Detected manual Major/Minor version bump in manifest.json: $NEW_VER"
          else
              if [ "$LATEST_TAG" = "v0.0.0" ]; then
                  NEW_VER="$MANIFEST_VER"
              else
                  NEXT_PATCH=$((LATEST_PATCH + 1))
                  NEW_VER="${LATEST_MAJOR}.${LATEST_MINOR}.${NEXT_PATCH}"
              fi
              echo "Auto incremented patch version to: $NEW_VER"
          fi

          jq --arg v "$NEW_VER" '.version = $v' custom_components/hitachi_infrared/manifest.json > tmp.json && mv tmp.json custom_components/hitachi_infrared/manifest.json

          echo "TAG_NAME=v$NEW_VER" >> $GITHUB_ENV
          echo "VERSION=$NEW_VER" >> $GITHUB_ENV

      - name: Commit manifest.json version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/hitachi_infrared/manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): bump version to ${{ env.TAG_NAME }} [skip ci]" && git push origin release)

      - name: Zip custom component
        run: |
          cd custom_components
          zip -r ../hitachi_infrared.zip hitachi_infrared
          cd ..

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: hitachi_infrared.zip

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: hitachi_infrared.zip
          sbom-path: sbom.spdx.json

      - name: Create Release and Upload Assets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" hitachi_infrared.zip sbom.spdx.json \
            --title "Release ${{ env.TAG_NAME }}" \
            --generate-notes


